<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Nunito Sans — loaded async, never blocks rendering -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <title>MathQuest</title>

    <style>
      /* Critical inline CSS for instant first paint — no external deps */
      body {
        margin: 0;
        font-family: 'Nunito Sans', 'Segoe UI', Tahoma, sans-serif;
        background: #f6faff;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
